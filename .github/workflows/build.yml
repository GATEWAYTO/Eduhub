Name: Build APK
on:
push:
branches:
- main
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Build with Buildozer
uses: kivy/buildozer-action@v1
with:
buildozer_version: latest
env:
PLATFORM: android
- name: Upload artifacts
uses: actions/upload-artifact@v4
with:
name: package
path: bin/*.apk
